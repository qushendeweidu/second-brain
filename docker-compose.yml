name: second-brain

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: second_brain
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql
      - ./.docker/mysql/logs:/var/log/mysql
      - ./.docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - second-brain

  redis:
    image: redis:latest
    container_name: redis-service
    restart: always
    environment:
      TZ: Asia/Shanghai
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /etc/redis
        cat > /etc/redis/users.acl << EOF
        user default off
        user ${REDIS_USERNAME} on >${REDIS_PASSWORD} ~* +@all
        EOF
        exec redis-server --aclfile /etc/redis/users.acl --appendonly yes
    volumes:
      - ./.docker/redis/data:/data
    networks:
      - second-brain
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-service
    restart: always
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./.docker/minio/data:/data
    networks:
      - second-brain
  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka-service
    restart: always
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "${KAFKA_PORT}:9092"
    volumes:
      - ./.docker/kafka/data:/var/lib/kafka/data
    networks:
      - second-brain

networks:
  second-brain:
    driver: bridge